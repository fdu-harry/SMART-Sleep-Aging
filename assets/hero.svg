<svg xmlns="http://www.w3.org/2000/svg" width="780" height="296" viewBox="0 0 780 296" role="img" aria-labelledby="title desc">
<title id="title">SMART — Sleep Multi-agent Aging Reasoning Twin</title>
<desc id="desc">A framework for interpreting sleep and clinical narratives through age acceleration, organ asynchrony and decoding instability. Nine cohorts, 26,657 participants, 31,095 overnight sleep studies.</desc>
